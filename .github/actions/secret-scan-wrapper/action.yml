name: Secret Scan (LD-versioned)
description: |
  Thin wrapper around the versioned secret-scan shared action. See the
  sast-scan-wrapper action.yml header for the rationale (GitHub Actions
  parser does not accept dynamic `uses:` refs at workflow step level, so
  we route the version through a composite action's input instead).

inputs:
  version:
    description: Version suffix (v1, v2, stable, ...) resolved by LaunchDarkly.
    required: true

runs:
  using: composite
  steps:
    - uses: EmilHorne/gh-shared-actions-demo/.github/actions/secret-scan@secret-scan-${{ inputs.version }}
